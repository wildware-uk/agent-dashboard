<!doctype html>
<html lang="en" data-theme="dark" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="text-scale" content="scale" />
		<!--
			Dark-first with system preference (design §7).

			The document is authored dark, so that is what paints first — no light
			flash, and no reliance on a media query that cannot tell "no preference"
			from "prefers light". This blocking script then downgrades to light when
			the OS asks for light, or applies the owner's explicit choice if they made
			one. It must stay inline, and above the head placeholder below, to run
			before paint. (Do not write that placeholder's literal name here: the
			template substitutes the first occurrence, so naming it in this comment
			injects the real head into the comment and leaves the tag below intact.)
		-->
		<script>
			(() => {
				let theme = 'dark';
				try {
					const saved = localStorage.getItem('theme');
					if (saved === 'light' || saved === 'dark') theme = saved;
					else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
				} catch {
					/* private mode: stay dark */
				}
				const root = document.documentElement;
				root.dataset.theme = theme;
				root.classList.toggle('dark', theme === 'dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
